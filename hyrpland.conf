#--- MONITORS ---
# Monitor Configuration: Name, Res@Hz, Offset, Scale
monitor=,preferred,auto,1
monitor = , addreserved, 0, 0, 0, 0
# --- CURSOR ---
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
# --- AUTOSTART ---
# 1. Force export environment variables into OpenRC's D-Bus stack
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland

# 2. Panels and Desktop Assets
exec-once = waybar
exec-once = nwg-dock-hyprland -p left -i 32 -w 5 -d -hd 50 -mt 44 -a start -l overlay
exec-once = waypaper --restore
# 3. Purge ghost audio loops and start fresh on every single reload
exec-once = gentoo-pipewire-launcher restart
#Mako 
exec-once = mako

exec-once = pipewire & pipewire-pulse & wireplumber
# --- INPUT CONFIG ---
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

# --- LOOK & FEEL ---
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(33ccffff) rgba(00ff99ff) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 12
    
    # Clean drop shadows for window separation
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
    }
}

# --- ADVANCED ANIMATIONS ---
# High-responsiveness Bezier curves (Fluid & snappy)
animations {
    enabled = true

    # Custom Bezier easing functions
    bezier = fluidOut, 0.25, 1, 0.5, 1
    bezier = easeInOut, 0.42, 0, 0.58, 1
    bezier = sharpIn, 0.6, 0, 0.4, 1

    # Animation layout mapping (Style, speed factor, curve)
    animation = windows, 1, 4, fluidOut, slide         # Windows slide smoothly into place
    animation = windowsIn, 1, 4, fluidOut, slide
    animation = windowsOut, 1, 3.5, sharpIn, slide
    animation = windowsMove, 1, 4, fluidOut            # Dragging/moving windows physics
    animation = border, 1, 5, easeInOut                # Smoothly cycling gradient borders
    animation = fade, 1, 4, fluidOut                   # Fade animations for menus
    animation = workspaces, 1, 4, fluidOut, slide      # Workspaces slide perfectly left-to-right
}

# --- KEYBINDS ---
$mainMod = SUPER

# Core App Triggers
bind = $mainMod, return, exec, kitty
bind = $mainMod, Q, killactive, 
bind = $mainMod, M, exit,                          # Instantly exit Hyprland back to TTY
bind = $mainMod, E, exec, thunar
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, Z, exec, wlogout
# Window Navigation (Vim Keys)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move/Resize windows with mouse controls
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 0
# Move active window to workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 0
# Audio controls (WirePlumber / PipeWire)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.0
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
#Brightness Control 
# Brightness controls
bind = , XF86MonBrightnessUp,   exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
#Grimblast
bind = , Print, exec, grimblast save area ~/Photos/SS/$(date +'%Y-%m-%d_%H-%M-%S').png
#Battery notify 
exec-once = ~/.local/bin/battery-notify
#Hyprsunset
bind = , F4, exec, ~/.local/bin/toggle-hyprsunset
